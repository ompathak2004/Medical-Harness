<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSearch Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header .subtitle { font-size: 0.8rem; color: #a0a0c0; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      background: #1a1a2e;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: #fff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.assistant h3 { margin: 12px 0 6px; font-size: 0.95rem; }
    .msg.assistant p { margin: 4px 0; }
    .msg.assistant ul, .msg.assistant ol { margin: 4px 0 4px 20px; }

    .msg.system {
      background: #fff8e1;
      border: 1px solid #ffe082;
      align-self: center;
      text-align: center;
      font-size: 0.85rem;
      color: #6d4c00;
    }

    /* Tool results badge */
    .tool-badge {
      display: inline-block;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 6px 4px;
      font-size: 0.85rem;
    }
    .tool-badge strong { color: #2e7d32; }

    /* Articles */
    .article-list { margin-top: 12px; }
    .article-item {
      background: #f5f5ff;
      border: 1px solid #c5cae9;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 6px 0;
      font-size: 0.85rem;
    }
    .article-item a { color: #303f9f; text-decoration: none; }
    .article-item a:hover { text-decoration: underline; }
    .article-item .meta { color: #666; font-size: 0.8rem; }

    /* Follow-up suggestion chips */
    .followup-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      background: #e3f2fd;
      border: 1px solid #90caf9;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chip:hover { background: #bbdefb; }

    /* Input area */
    #input-area {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
    }
    #input-area textarea {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    #input-area textarea:focus { outline: none; border-color: #1a1a2e; }
    #input-area button {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 24px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #input-area button:hover { background: #2a2a4e; }
    #input-area button:disabled { background: #999; cursor: not-allowed; }

    .loading-dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    .disclaimer {
      text-align: center;
      font-size: 0.75rem;
      color: #888;
      padding: 6px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>MediSearch Agent</h1>
    <div class="subtitle">Evidence-based Medical QA</div>
  </div>
</header>

<div id="chat-container">
  <div class="msg system">
    Ask any medical question. The agent will retrieve evidence from peer-reviewed sources,
    apply validated clinical tools when relevant, and provide a cited answer.
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Ask a medical question..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>
<div class="disclaimer">
  This tool provides information only — it is not a substitute for professional medical advice.
</div>

<script>
  // State
  let conversationId = null;
  let conversation = []; // alternating user/AI messages

  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  // Auto-resize textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });
  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function addMessage(html, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerHTML = html;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    if (on) {
      sendBtn.textContent = '';
      sendBtn.classList.add('loading-dots');
    } else {
      sendBtn.textContent = 'Send';
      sendBtn.classList.remove('loading-dots');
    }
  }

  async function sendMessage(text) {
    const msg = text || userInput.value.trim();
    if (!msg) return;

    userInput.value = '';
    userInput.style.height = 'auto';

    // Add user message to UI
    addMessage(escapeHtml(msg), 'user');
    // Add to conversation history
    conversation.push(msg);

    setLoading(true);

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          conversation: conversation,
          conversation_id: conversationId,
        }),
      });

      if (!resp.ok) {
        const err = await resp.json();
        addMessage('Error: ' + (err.detail || resp.statusText), 'system');
        // Remove the message we just added since it failed
        conversation.pop();
        setLoading(false);
        return;
      }

      const data = await resp.json();
      conversationId = data.conversation_id;

      if (data.type === 'follow_up') {
        // Agent needs more info — show follow-up questions
        let html = '<strong>I need a few more details:</strong><ul>';
        data.follow_up_questions.forEach(q => {
          html += '<li>' + escapeHtml(q) + '</li>';
        });
        html += '</ul>';
        addMessage(html, 'assistant');

        // Store assistant message in conversation so next user reply continues the thread
        conversation.push(data.follow_up_questions.join(' '));

      } else {
        // Full answer
        let html = '';

        // Tool results
        if (data.tool_results && data.tool_results.length > 0) {
          data.tool_results.forEach(tr => {
            html += '<div class="tool-badge"><strong>' + escapeHtml(tr.tool || '') + '</strong>';
            if (tr.score !== undefined) html += ' &mdash; Score: ' + tr.score;
            if (tr.risk) html += ' | Risk: ' + escapeHtml(tr.risk);
            if (tr.recommendation) html += '<br>' + escapeHtml(tr.recommendation);
            if (tr.ten_year_risk_percent !== undefined) html += '<br>10-year CVD risk: ' + tr.ten_year_risk_percent + '%';
            if (tr.grade !== undefined) html += ' | Grade: ' + tr.grade + '/5 — ' + escapeHtml(tr.description || '');
            html += '</div>';
          });
        }

        // Main answer
        html += '<div class="answer-body">' + renderMarkdown(data.answer || '') + '</div>';

        // Articles
        if (data.articles && data.articles.length > 0) {
          html += '<div class="article-list"><strong>Sources:</strong>';
          data.articles.forEach((art, i) => {
            html += '<div class="article-item">';
            html += '[' + (i+1) + '] ';
            if (art.url) {
              html += '<a href="' + escapeHtml(art.url) + '" target="_blank">' + escapeHtml(art.title || 'Article') + '</a>';
            } else {
              html += escapeHtml(art.title || 'Article');
            }
            const meta = [];
            if (art.year) meta.push(art.year);
            if (art.journal) meta.push(art.journal);
            if (art.authors && art.authors.length) meta.push(art.authors.slice(0,3).join(', '));
            if (meta.length) html += ' <span class="meta">(' + escapeHtml(meta.join(' | ')) + ')</span>';
            if (art.tldr) html += '<br><em>' + escapeHtml(art.tldr) + '</em>';
            html += '</div>';
          });
          html += '</div>';
        }

        addMessage(html, 'assistant');

        // Store assistant answer in conversation for multi-turn
        conversation.push(data.answer || '');

        // Follow-up suggestion chips
        if (data.followups && data.followups.length > 0) {
          let chipHtml = '<div class="followup-chips">';
          data.followups.forEach(q => {
            chipHtml += '<span class="chip" onclick="sendMessage(\'' + escapeAttr(q) + '\')">' + escapeHtml(q) + '</span>';
          });
          chipHtml += '</div>';
          const chipDiv = document.createElement('div');
          chipDiv.style.maxWidth = '780px';
          chipDiv.style.width = '100%';
          chipDiv.style.margin = '0 auto';
          chipDiv.innerHTML = chipHtml;
          chatContainer.appendChild(chipDiv);
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }
      }

    } catch (e) {
      addMessage('Network error: ' + e.message, 'system');
      conversation.pop();
    }

    setLoading(false);
  }

  // Simple markdown-ish rendering (bold, italic, headers, lists, line breaks)
  function renderMarkdown(text) {
    let html = escapeHtml(text);
    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^# (.+)$/gm, '<h3>$1</h3>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Unordered lists
    html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    // Line breaks
    html = html.replace(/\n/g, '<br>');
    // Clean up double <br> after lists
    html = html.replace(/<\/ul><br>/g, '</ul>');
    html = html.replace(/<\/li><br>/g, '</li>');
    return html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
