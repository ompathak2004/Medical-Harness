name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Check Python code
        run: uv run --no-sync ruff check app tests evals
      - name: Run tests
        run: uv run --no-sync pytest -q
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify committed frontend bundles
        run: |
          changes=$(git status --porcelain --untracked-files=all -- static/dist static/build.json)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: npm run check:anatomy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_SERVER_COMMAND: uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8080 --no-access-log
  test:
    if: always()
    needs: [backend, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all checks
        env:
          BACKEND: ${{ needs.backend.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$BACKEND" = success && test "$BROWSER" = success
